name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript and Python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/requirements.txt
            ml/requirements-training.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ml/requirements.txt -r ml/requirements-training.txt

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run application tests
        run: npm test

      - name: Build release bundle
        run: npm run build

      - name: Run ML foundation tests
        run: python -m unittest discover -s ml/tests -t .

      - name: Run ML training tests
        run: python -m unittest discover -s ml/tests_training -t .
